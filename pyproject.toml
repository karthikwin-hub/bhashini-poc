[project]
name = "bhashini-app"
version = "0.1.0"
description = "Bhashini Sovereign Multilingual AI Application"
readme = "README.md"
authors = [
    { name = "Karthik.Linux", email = "299996058+karthikwin-hub@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "docs",
    "scripts/harness",
    ".specify",
    ".agent",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

